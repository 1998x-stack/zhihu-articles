name: Validate writing framework
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check skill mirror consistency
        run: python scripts/sync_skills.py --check
      - name: Validate SKILL metadata, routing, ownership, templates
        run: python scripts/validate_repo.py
      - name: Install ebook renderer dependencies
        run: python -m pip install -r scripts/requirements-pages.txt
      - name: Unit test workflow stage gates
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Python syntax validation
        run: python -m compileall -q scripts
