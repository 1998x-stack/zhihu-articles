name: Publish e-book bookshelf

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "catalog.json"
      - "articles/**/book.json"
      - "articles/**/draft/**"
      - "scripts/build_pages.py"
      - "scripts/requirements-pages.txt"
      - ".github/workflows/pages.yml"
  schedule:
    # The Empty Spaces lives in another repository; refresh its chapters daily.
    - cron: "21 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout The Empty Spaces book manuscript
        uses: actions/checkout@v4
        with:
          repository: 1998x-stack/The-Empty-Spaces
          ref: main
          path: external/the-empty-spaces
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Markdown renderer
        run: python -m pip install -r scripts/requirements-pages.txt
      - name: Build the public bookshelf and all mapped chapters
        run: python scripts/build_pages.py --out _site --require-all-sources
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
