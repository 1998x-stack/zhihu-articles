<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 410" role="img" aria-labelledby="t d">
<title id="t">刘徽割圆术：内接六边形十二边形二十四边形逐次增边</title><desc id="d">同半径的三个圆，依次内接六边形、十二边形和二十四边形。随着边数加倍，多边形更贴近圆周，圆和多边形间的余量逐渐缩小。</desc>
<rect width="950" height="410" rx="16" fill="#f8fafc"/>
<text x="28" y="43" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-weight="700" font-size="23" fill="#0f172a">割之弥细，所失弥少</text>
<circle cx="180" cy="201" r="105" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<polygon points="180.000,96.000 270.933,148.500 270.933,253.500 180.000,306.000 89.067,253.500 89.067,148.500" fill="#fb923c" fill-opacity=".20" stroke="#c2410c" stroke-width="3"/>
<text x="180" y="345" text-anchor="middle" font-size="20" font-weight="600" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#1e293b">正六边形</text>
<text x="180" y="372" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#475569">6 → 12 可继续倍边</text><circle cx="470" cy="201" r="105" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<polygon points="470.000,96.000 522.500,110.067 560.933,148.500 575.000,201.000 560.933,253.500 522.500,291.933 470.000,306.000 417.500,291.933 379.067,253.500 365.000,201.000 379.067,148.500 417.500,110.067" fill="#5fd1c3" fill-opacity=".20" stroke="#0f766e" stroke-width="3"/>
<text x="470" y="345" text-anchor="middle" font-size="20" font-weight="600" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#1e293b">正十二边形</text>
<text x="470" y="372" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#475569">12 → 24 可继续倍边</text><circle cx="760" cy="201" r="105" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
<polygon points="760.000,96.000 787.176,99.578 812.500,110.067 834.246,126.754 850.933,148.500 861.422,173.824 865.000,201.000 861.422,228.176 850.933,253.500 834.246,275.246 812.500,291.933 787.176,302.422 760.000,306.000 732.824,302.422 707.500,291.933 685.754,275.246 669.067,253.500 658.578,228.176 655.000,201.000 658.578,173.824 669.067,148.500 685.754,126.754 707.500,110.067 732.824,99.578" fill="#75b5f8" fill-opacity=".20" stroke="#1d4ed8" stroke-width="3"/>
<text x="760" y="345" text-anchor="middle" font-size="20" font-weight="600" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#1e293b">正二十四边形</text>
<text x="760" y="372" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#475569">24 → 48 可继续倍边</text>
<text x="30" y="399" font-family="sans-serif" font-size="12.5" fill="#64748b">原创现代几何示意。刘徽《九章算术注》原文与本图标注方式并不相同。</text>
</svg>