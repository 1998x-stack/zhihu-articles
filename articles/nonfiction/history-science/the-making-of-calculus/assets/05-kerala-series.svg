<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 420" role="img" aria-labelledby="title desc"><title id="title">计算圆周率：两条级数的前六项近似结果</title><desc id="desc">橙色曲线为奇数分母交错级数的圆周率部分和，青绿色曲线是取反正切自变量1除以根号3后得到的较快收敛级数。虚线代表真实圆周率。比较前六项，青绿色曲线更快靠近目标。</desc><rect width="930" height="420" rx="16" fill="#f8fafc"/><text x="30" y="43" font-size="23" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-weight="700" fill="#0f172a">无穷级数也有速度：前 N 项的逼近</text><line x1="90" y1="85" x2="90" y2="318" stroke="#94a3b8" stroke-width="2"/><line x1="90" y1="318" x2="750" y2="318" stroke="#94a3b8" stroke-width="2"/><line x1="90" y1="223.90" x2="750" y2="223.90" stroke="#64748b" stroke-width="2" stroke-dasharray="8 7"/><path d="M90.0,98.0 L215.0,293.6 L340.0,176.2 L465.0,260.0 L590.0,194.8 L715.0,248.2" fill="none" stroke="#ea580c" stroke-width="3.5"/><path d="M90.0,176.6 L215.0,233.1 L340.0,221.8 L465.0,224.4 L590.0,223.8 L715.0,223.9" fill="none" stroke="#0f766e" stroke-width="3.5"/><circle cx="90.0" cy="98.0" r="5" fill="#ea580c"/><circle cx="215.0" cy="293.6" r="5" fill="#ea580c"/><circle cx="340.0" cy="176.2" r="5" fill="#ea580c"/><circle cx="465.0" cy="260.0" r="5" fill="#ea580c"/><circle cx="590.0" cy="194.8" r="5" fill="#ea580c"/><circle cx="715.0" cy="248.2" r="5" fill="#ea580c"/><circle cx="90.0" cy="176.6" r="5" fill="#0f766e"/><circle cx="215.0" cy="233.1" r="5" fill="#0f766e"/><circle cx="340.0" cy="221.8" r="5" fill="#0f766e"/><circle cx="465.0" cy="224.4" r="5" fill="#0f766e"/><circle cx="590.0" cy="223.8" r="5" fill="#0f766e"/><circle cx="715.0" cy="223.9" r="5" fill="#0f766e"/><g font-family="sans-serif" font-size="15" fill="#334155"><text x="90" y="344" text-anchor="middle">1</text><text x="215" y="344" text-anchor="middle">2</text><text x="340" y="344" text-anchor="middle">3</text><text x="465" y="344" text-anchor="middle">4</text><text x="590" y="344" text-anchor="middle">5</text><text x="715" y="344" text-anchor="middle">6</text><text x="374" y="378">使用前 N 项</text><text x="758" y="228.9">π≈3.14159</text><text x="780" y="115" fill="#ea580c">奇数交错级数</text><text x="780" y="152" fill="#0f766e">较快级数</text><text x="30" y="400" font-size="12" fill="#64748b">现代算式数值重绘；不是14—16世纪手稿的图。</text></g></svg>