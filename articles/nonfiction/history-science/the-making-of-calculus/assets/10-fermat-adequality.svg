<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 435" role="img" aria-labelledby="title description">
<title id="title">费马拟等法：固定两边和的矩形面积函数在x等于5时最大</title>
<desc id="description">横轴为一边长度x从0到10，纵轴为面积x乘10减x。蓝色抛物线在x等于5取得峰值25。两个橙色近邻点表示分别计算原变量a与改变e后的a加e，面积接近但不必严格相等。</desc>
