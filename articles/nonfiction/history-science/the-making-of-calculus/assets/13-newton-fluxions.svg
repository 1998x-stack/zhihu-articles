<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">牛顿流数法：正方形边长微增时面积拆分</title><desc id="d">左侧旧正方形边长x，用深蓝色标出；增加长度Delta x后右侧和下侧各新增一个长方形，右下角新增小正方形Delta x平方。新面积比旧面积多2xDelta x加Delta x平方。</desc><rect width="960" height="420" rx="16" fill="#f8fafc"/><text x="28" y="44" font-size="23" font-weight="700" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0f172a">一个边长的微小增长，如何传给面积？</text><rect x="165" y="98" width="222" height="222" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/><rect x="387" y="98" width="53" height="222" fill="#6ee7b7" stroke="#047857" stroke-width="2.5"/><rect x="165" y="320" width="222" height="53" fill="#6ee7b7" stroke="#047857" stroke-width="2.5"/><rect x="387" y="320" width="53" height="53" fill="#fcd34d" stroke="#b45309" stroke-width="2.5"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" fill="#1e293b"><text x="267" y="208" fill="#1e40af">x²</text><text x="405" y="211" fill="#065f46">xΔx</text><text x="257" y="352" fill="#065f46">xΔx</text><text x="395" y="351" font-size="13" fill="#92400e">(Δx)²</text><text x="265" y="90" font-size="14">x</text><text x="395" y="90" font-size="14">Δx</text><text x="522" y="148" font-size="21" font-weight="700">Δy = 2xΔx + (Δx)²</text><text x="522" y="208" font-size="18">除以时间增量，取适当极限：</text><text x="522" y="254" fill="#047857" font-size="24">ẏ = 2xẋ</text><text x="30" y="405" font-size="13" fill="#64748b">原创教学图。现代极限解释不能等同于1666年牛顿的全部论证。</text></g></svg>