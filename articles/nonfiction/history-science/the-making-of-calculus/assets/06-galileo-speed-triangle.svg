<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 415" role="img" aria-labelledby="title desc"><title id="title">伽利略匀加速运动的现代速度时间图</title><desc id="desc">从静止出发、加速度恒为2米每二次方秒，在四秒内速度从零增加到八米每秒。各一秒的速度时间图下方面积依次为1、3、5、7米，共16米。</desc><rect width="950" height="415" rx="16" fill="#f8fafc"/><text x="25" y="43" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#0f172a">同样的一秒，路程为什么是 1、3、5、7？</text><polygon points="124,332 263,332 263,280 124,332" fill="#c6f3ec" stroke="#0f766e" stroke-width="1.5"/><polygon points="263,332 402,332 402,228 263,280" fill="#a8e0d7" stroke="#0f766e" stroke-width="1.5"/><polygon points="402,332 541,332 541,176 402,228" fill="#7ecbc6" stroke="#0f766e" stroke-width="1.5"/><polygon points="541,332 680,332 680,124 541,176" fill="#4cb2b2" stroke="#0f766e" stroke-width="1.5"/><line x1="124" y1="332" x2="725" y2="332" stroke="#334155" stroke-width="2.5"/><line x1="124" y1="332" x2="124" y2="91" stroke="#334155" stroke-width="2.5"/><line x1="124" y1="332" x2="680" y2="124" stroke="#1d4ed8" stroke-width="4"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="16" fill="#1e293b"><text x="124" y="358" text-anchor="middle">0</text><text x="263" y="358" text-anchor="middle">1</text><text x="402" y="358" text-anchor="middle">2</text><text x="541" y="358" text-anchor="middle">3</text><text x="680" y="358" text-anchor="middle">4</text><text x="699" y="358">时间 t（秒）</text><text x="24" y="105">速度 v（m/s）</text><text x="97" y="338" text-anchor="end">0</text><text x="97" y="286" text-anchor="end">2</text><text x="97" y="234" text-anchor="end">4</text><text x="97" y="182" text-anchor="end">6</text><text x="97" y="130" text-anchor="end">8</text><text x="193.5" y="312" font-weight="700" text-anchor="middle">1 m</text><text x="332.5" y="260" font-weight="700" text-anchor="middle">3 m</text><text x="471.5" y="208" font-weight="700" text-anchor="middle">5 m</text><text x="610.5" y="156" font-weight="700" text-anchor="middle">7 m</text><text x="26" y="392" fill="#64748b" font-size="13">理想模型 a=2m/s²。每块区域代表一秒的位移；全部面积等于16米。</text></g></svg>