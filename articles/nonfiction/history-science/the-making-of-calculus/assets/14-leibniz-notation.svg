<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="t d"><title id="t">莱布尼茨微分规则：同一函数两条计算路线汇合</title><desc id="d">上方是函数y=x平方乘以x加1。左侧展开为x三次加x平方并逐项微分；右侧把x平方和x加1看成两部分利用乘积法则。两条路线得到相同微分结果dy等于三x平方加二x乘dx。</desc>
<rect width="1100" height="470" rx="18" fill="#f8fafc"/><text x="30" y="46" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="700" fill="#0f172a">记号的力量：不同算法，可以验证同一个答案</text>
<rect x="345" y="77" width="410" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="550" y="118" text-anchor="middle" font-size="27" font-family="sans-serif" fill="#1e40af">y = x²(x + 1)</text>
<path d="M465 141 L290 191 M635 141 L810 191" stroke="#64748b" stroke-width="3" fill="none"/><rect x="70" y="190" width="430" height="114" rx="13" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/><rect x="600" y="190" width="430" height="114" rx="13" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0f172a"><text x="100" y="223" font-size="19" font-weight="700">路线 A：先展开，再逐项求微分</text><text x="100" y="256" font-size="22">y = x³ + x²</text><text x="100" y="287" font-size="21">dy = (3x² + 2x)dx</text><text x="630" y="223" font-size="19" font-weight="700">路线 B：直接使用乘积法则</text><text x="630" y="256" font-size="21">d(uv) = u dv + v du</text><text x="630" y="287" font-size="21">dy = [x² + 2x(x+1)]dx</text></g>
<path d="M290 305 L460 355 M810 305 L640 355" stroke="#64748b" stroke-width="3" fill="none"/><rect x="280" y="350" width="540" height="59" rx="11" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="550" y="388" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#92400e">dy/dx = 3x² + 2x</text>
<text x="30" y="452" font-size="14" fill="#64748b" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">原创现代教学结构图，非1684年《Nova Methodus》原书图版。</text></svg>