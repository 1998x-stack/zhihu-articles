<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title description">
<title id="title">笛卡尔法线法：抛物线与相切圆</title>
<desc id="description">蓝色抛物线y=x²，橙色圆圆心C在纵轴0,1.5，半径平方1.25。圆与抛物线在P点1,1相切；绿线为P点切线斜率2；圆心到点的红色半径为法线斜率负二分之一。</desc>
