<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 475" role="img" aria-labelledby="t d"><title id="t">微积分基本定理：增加一小段横向距离，新面积由高低矩形夹逼</title><desc id="d">图为抛物线y=x平方，累计面积A(x)从原点到x，右侧的新增薄片在x和x加h之间。蓝色为原累计面积，绿色为新增面积。虚线框表示最小和最大高度的矩形，随着h缩小，两个矩形高度都逼近f(x)。</desc>
